# Teste puis construit FootAnalytics pour Windows (installeur + version portable), macOS (Apple Silicon)
# et Linux (x86_64).
# - à chaque push sur main : les fichiers sont disponibles dans l'onglet Actions (artefacts)
# - sur un tag v* (ex. v2.3.0) : ils sont publiés dans une Release GitHub
#
# Sécurité : droits en lecture seule par défaut ; seul le job « release » (tags uniquement) peut écrire.
# Les actions sont figées sur un commit précis (le commentaire indique la version correspondante).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: windows
            os: windows-latest
          - system: macos
            os: macos-14
          - system: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 xvfb

      - name: Installer les dépendances (versions exactes)
        run: pip install -r requirements-dev.txt

      # vérifications indépendantes du système : une seule fois
      - name: Vérifier la qualité du code (ruff)
        if: runner.os == 'Windows'
        run: ruff check .

      - name: Vérifier les types (mypy)
        if: runner.os == 'Windows'
        run: mypy

      - name: Vérifier les failles connues des dépendances
        if: runner.os == 'Windows'
        run: pip-audit -r requirements.lock

      - name: Vérifier que la version de l'application correspond au tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from footapp.config import APP_VERSION; print(APP_VERSION)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version v$version"; exit 1; }

      - name: Lancer les tests et mesurer la couverture (données enregistrées, sans réseau, interface comprise)
        run: python -m pytest -q --cov=footapp --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Vérifier que l'interface s'importe
        run: python -c "import footapp.ui.main_window"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Installer Inno Setup
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Construire l'application, la version portable et l'installeur (Windows)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build.ps1
        env:
          PYTHON_EXE: python

      - name: Construire l'application et son archive (macOS, Linux)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        run: bash build.sh
        env:
          PYTHON_EXE: python

      # l'application construite démarre-t-elle vraiment (bibliothèques et extensions Qt présentes) ?
      - name: Lancer l'application construite (macOS, Linux)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            exe=dist/FootAnalytics.app/Contents/MacOS/FootAnalytics
            log="$HOME/Library/Application Support/FootAnalytics/logs/footanalytics.log"
          else
            exe=dist/FootAnalytics/FootAnalytics
            log="$HOME/.local/share/FootAnalytics/logs/footanalytics.log"
            Xvfb :99 -screen 0 1600x1000x24 & export DISPLAY=:99  # écran virtuel : vraie extension xcb
            sleep 2
          fi
          "$exe" & pid=$!
          sleep 25
          if ! kill -0 "$pid" 2>/dev/null; then echo "L'application s'est arrêtée au démarrage"; cat "$log"; exit 1; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            screencapture -x capture-macos.png || true
          else
            python -c "from PySide6.QtGui import QGuiApplication as A; a = A([]);
          a.primaryScreen().grabWindow(0).save('capture-linux.png')" || true
          fi
          kill "$pid"; wait "$pid" || true
          cat "$log"
          grep -q "Démarrage" "$log"
          ! grep "CRITICAL" "$log"   # aucune erreur non gérée

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: FootAnalytics-${{ matrix.system }}
          path: |
            dist/FootAnalytics-Setup-*.exe
            dist/FootAnalytics-*-portable.zip
            dist/FootAnalytics-*-macos-*.zip
            dist/FootAnalytics-*-linux-*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        with:
          name: capture-${{ matrix.system }}
          path: capture-*.png
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publication de la Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: FootAnalytics-*
          merge-multiple: true
          path: dist

      - name: Publier la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/FootAnalytics-Setup-*.exe
            dist/FootAnalytics-*-portable.zip
            dist/FootAnalytics-*-macos-*.zip
            dist/FootAnalytics-*-linux-*.tar.gz
