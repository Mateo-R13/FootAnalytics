# Teste puis construit FootAnalytics pour Windows (installeur + version portable).
# - à chaque push sur main : les fichiers sont disponibles dans l'onglet Actions (artefact)
# - sur un tag v* (ex. v2.3.0) : ils sont publiés dans une Release GitHub
#
# Sécurité : droits en lecture seule par défaut ; seul le job « release » (tags uniquement) peut écrire.
# Les actions sont figées sur un commit précis (le commentaire indique la version correspondante).
name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances (versions exactes)
        run: pip install -r requirements-dev.txt

      - name: Vérifier la qualité du code (ruff)
        run: ruff check .

      - name: Vérifier les failles connues des dépendances
        run: pip-audit -r requirements.lock

      - name: Vérifier que la version de l'application correspond au tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from footapp.config import APP_VERSION; print(APP_VERSION)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version v$version"; exit 1; }

      - name: Lancer les tests (données enregistrées, sans réseau, interface comprise)
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Vérifier que l'interface s'importe
        run: python -c "import footapp.ui.main_window"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Installer Inno Setup
        if: github.event_name != 'pull_request'
        run: choco install innosetup -y --no-progress

      - name: Construire l'application, la version portable et l'installeur
        if: github.event_name != 'pull_request'
        run: powershell -ExecutionPolicy Bypass -File build.ps1
        env:
          PYTHON_EXE: python

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: FootAnalytics-windows
          path: |
            dist/FootAnalytics-Setup-*.exe
            dist/FootAnalytics-*-portable.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publication de la Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: FootAnalytics-windows
          path: dist

      - name: Publier la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/FootAnalytics-Setup-*.exe
            dist/FootAnalytics-*-portable.zip
