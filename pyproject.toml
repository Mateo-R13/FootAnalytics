# Configuration des outils (le projet n'est pas distribué comme paquet Python : voir build.ps1).

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W : style PEP 8 · F : erreurs (noms inconnus, imports inutiles) · I : ordre des imports
# B : bugs probables · UP : syntaxe Python moderne · SIM/C4/PIE : simplifications · RUF : règles ruff
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographie française volontaire (« », ’, …) dans textes et commentaires
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["footapp"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# pandas, QtAwesome… ne fournissent pas d'annotations exploitables : vus comme `Any`
ignore_missing_imports = true

# Cœur de l'application (données, calculs, accès réseau) : toutes les fonctions sont annotées
[[tool.mypy.overrides]]
module = ["footapp.analysis", "footapp.api.*", "footapp.updates", "footapp.config", "footapp.logs", "footapp.data"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = ["footapp"]
# sys.monitoring (Python 3.12) : suit aussi les fils créés par Qt (QThreadPool des tâches de fond),
# que le traceur classique ne voit pas
core = "sysmon"

[tool.coverage.report]
# plancher : `pytest --cov=footapp` échoue si la couverture du code passe en dessous
fail_under = 85
show_missing = true
skip_covered = true
